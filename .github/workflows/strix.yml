name: Strix Security Audit & Guardrails

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate Manifest Permissions & CSP
        run: node scripts/validate-extension.mjs

      - name: Run Security & Telemetry Tests
        run: npm test -- --testPathPatterns="manifest|estimator"

      - name: Dependency Security Check
        run: npm audit --audit-level=high || true
